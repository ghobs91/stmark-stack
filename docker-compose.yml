services:
  postgres:
    image: postgres:16-alpine
    container_name: church_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-church_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-saintmark_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed on 5433 for local (non-Docker) development so it does not
      # collide with an existing PostgreSQL on the host's 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-church_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: church_migrate
    restart: 'no'
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-church_admin}:${POSTGRES_PASSWORD:-secure_db_password}@postgres:5432/${POSTGRES_DB:-saintmark_db}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NODE_ENV: production
    command: npm run migrate
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: church_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-church_admin}:${POSTGRES_PASSWORD:-secure_db_password}@postgres:5432/${POSTGRES_DB:-saintmark_db}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${SERVER_URL:-https://saintmarkcenter.org}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_CHANNEL_IDS: ${YOUTUBE_CHANNEL_IDS}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      KATAMEROS_API_URL: ${KATAMEROS_API_URL}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    container_name: church_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
